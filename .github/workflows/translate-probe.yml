name: Translate probe
on:
  push:
    paths:
      - ".github/workflows/translate-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe clients5 batching
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          texts = ["Welcome back", "Save changes", "Total users", "You are already signed in to {tenant}."]
          for n in (1, 4):
              q = " ||| ".join(texts[:n])
              url = "https://clients5.google.com/translate_a/t?" + urllib.parse.urlencode(
                  {"client": "dict-chrome-ex", "sl": "en", "tl": "zh-CN", "q": q})
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  print(n, r.status, r.read().decode("utf-8", "replace"))
          PY
