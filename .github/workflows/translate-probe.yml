name: Translate probe
on:
  push:
    paths:
      - ".github/workflows/translate-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe translation providers
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          tests = [
            ("google-gtx", "https://translate.googleapis.com/translate_a/single?" + urllib.parse.urlencode({"client":"gtx","sl":"en","tl":"zh-CN","dt":"t","q":"Welcome back"})),
            ("google-clients5", "https://clients5.google.com/translate_a/t?" + urllib.parse.urlencode({"client":"dict-chrome-ex","sl":"en","tl":"zh-CN","q":"Welcome back"})),
            ("google-web", "https://translate.google.com/translate_a/single?" + urllib.parse.urlencode({"client":"gtx","sl":"en","tl":"zh-CN","dt":"t","q":"Welcome back"})),
            ("mymemory", "https://api.mymemory.translated.net/get?" + urllib.parse.urlencode({"q":"Welcome back","langpair":"en|zh-CN"})),
            ("lingva", "https://lingva.ml/api/v1/en/zh/Welcome%20back"),
          ]
          for name, url in tests:
            try:
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                print(name, r.status, r.read(180).decode("utf-8", "replace"))
            except Exception as e:
              print(name, "ERR", repr(e))
          PY
