name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB: ucenter_ci
      BASE_URL: http://localhost:8080
      DEV: "true"
      MAIL_DRIVER: mock
      WEBHOOK_ALLOW_PRIVATE: "true"
      WEBHOOK_RETRY_BASE_SECONDS: "1"
      WEBHOOK_WORKER_SECONDS: "1"
      ENCRYPTION_KEY: ci-test-encryption-key
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: server/go.sum

      - name: Go test
        working-directory: server
        run: go test -tags nomsgpack ./...

      - name: Go vet
        working-directory: server
        run: go vet -tags nomsgpack ./...

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - name: Validate compose file
        run: docker compose config > /dev/null

      - name: Validate OpenAPI
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          spec = yaml.safe_load(open("docs/openapi.yaml"))
          assert spec["openapi"].startswith("3.1"), spec["openapi"]
          assert "/api/auth/login" in spec["paths"]
          assert "/api/admin/users" in spec["paths"]
          print(f"OpenAPI {spec['openapi']}: {len(spec['paths'])} paths")
          PY

      - name: Go SDK tests
        working-directory: sdk/go
        run: go test ./...

      - name: Install TypeScript SDK
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: pnpm build

      - name: Build Vite example
        working-directory: examples/oidc-vite
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Seed demo data
        working-directory: server
        run: go run ./cmd/seed

      - name: Build server
        working-directory: server
        run: go build -tags nomsgpack -o /tmp/ucenter ./cmd/server

      - name: Start server
        working-directory: server
        run: |
          WEB_DIR=../web/dist /tmp/ucenter > /tmp/ucenter.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | jq -e '.status == "ok"'
          curl -fsS http://127.0.0.1:8080/readyz | jq -e '.status == "ready"'
          curl -fsS http://127.0.0.1:8080/metrics | grep -q 'ucenter_http_requests_total'
          curl -fsS http://127.0.0.1:8080/login > /dev/null

      - name: OIDC smoke test
        run: BASE_URL=http://127.0.0.1:8080 ./scripts/oidc-smoke.sh

      - name: MCP smoke test
        run: BASE_URL=http://127.0.0.1:8080 ./scripts/mcp-smoke.sh

      - name: Email flows smoke test
        run: BASE_URL=http://127.0.0.1:8080 ./scripts/email-smoke.sh

      - name: Billing smoke test
        run: BASE_URL=http://127.0.0.1:8080 ./scripts/billing-smoke.sh

      - name: Authorization smoke test
        run: BASE_URL=http://127.0.0.1:8080 ./scripts/authz-smoke.sh

      - name: Start webhook receiver
        run: |
          rm -f /tmp/webhook-deliveries.jsonl
          python3 scripts/webhook-receiver.py > /tmp/webhook-receiver.log 2>&1 &
          sleep 1

      - name: Webhook smoke test
        run: BASE_URL=http://127.0.0.1:8080 ./scripts/webhook-smoke.sh

      - name: Tenant lifecycle smoke test
        run: BASE_URL=http://127.0.0.1:8080 ./scripts/tenant-smoke.sh

      - name: TypeScript SDK smoke test
        run: BASE_URL=http://localhost:8080 pnpm --dir sdk/typescript smoke

      - name: SCIM smoke test
        run: BASE_URL=http://127.0.0.1:8080 ./scripts/scim-smoke.sh

      - name: Start mock SAML IdP
        working-directory: server
        run: |
          go build -tags nomsgpack -o /tmp/mock-saml-idp ./cmd/mock-saml-idp
          /tmp/mock-saml-idp > /tmp/mock-saml-idp.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9091/metadata >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mock-saml-idp.log
          exit 1

      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        working-directory: web
        run: pnpm e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
