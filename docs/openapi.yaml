openapi: 3.1.0
info:
  title: UCenter API
  version: 1.0.0
  description: Multi-tenant SSO, OIDC and administration API.
servers:
  - url: http://localhost:8080
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Auth
  - name: Admin
  - name: OIDC
  - name: SCIM
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, email, password]
              properties:
                tenant: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                totp: { type: string }
                requestId: { type: string }
      responses:
        '200':
          description: Login result or MFA challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - type: object
                    properties:
                      mfaRequired: { type: boolean }
                      mfaToken: { type: string }
                      mfaMethods:
                        type: array
                        items: { type: string, enum: [totp, webauthn] }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Self-register into a tenant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, email, password, name]
              properties:
                tenant: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                name: { type: string }
                requestId: { type: string }
      responses:
        '201': { description: Registered }
        '400': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      responses:
        '200': { description: Logged out }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user, tenant, roles and permissions
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, email]
              properties:
                tenant: { type: string }
                email: { type: string, format: email }
      responses:
        '200': { description: Always accepted }
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Consume a reset token
      security: []
      responses:
        '200': { description: Password updated }
        '400': { $ref: '#/components/responses/Error' }
  /api/auth/webauthn/begin:
    post:
      tags: [Auth]
      summary: Begin a passkey assertion
      security: []
      responses:
        '200':
          description: WebAuthn options and session id
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  options: { type: object, additionalProperties: true }
  /api/auth/webauthn/finish:
    post:
      tags: [Auth]
      summary: Finish a passkey assertion
      security: []
      responses:
        '200': { $ref: '#/components/schemas/LoginResponse' }
  /api/admin/overview:
    get:
      tags: [Admin]
      summary: Dashboard overview
      responses:
        '200':
          description: Stats and recent activity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/admin/users:
    get:
      tags: [Admin]
      summary: List users
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
    post:
      tags: [Admin]
      summary: Create or invite a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUserResponse' }
  /api/admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Admin]
      summary: Get a user
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Admin]
      summary: Update a user
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Admin]
      summary: Remove a user from the tenant
      responses:
        '200': { description: Removed }
  /api/admin/roles:
    get:
      tags: [Admin]
      summary: List roles
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [Admin]
      summary: Create a role
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Role' }
      responses:
        '201': { description: Created }
  /api/admin/clients:
    get:
      tags: [Admin]
      summary: List OIDC clients
      responses:
        '200':
          description: Clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OidcClient' }
    post:
      tags: [Admin]
      summary: Create an OIDC client
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: Created with one-time secret }
  /api/admin/sessions:
    get:
      tags: [Admin]
      summary: List active sessions
      responses:
        '200': { description: Sessions }
  /api/admin/audit:
    get:
      tags: [Admin]
      summary: List audit events
      responses:
        '200': { description: Audit events }
  /api/admin/settings:
    get:
      tags: [Admin]
      summary: Tenant settings
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: '#/components/schemas/Tenant' }
    patch:
      tags: [Admin]
      summary: Update tenant settings and branding
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Updated }
  /api/admin/export:
    get:
      tags: [Admin]
      summary: Export sanitized tenant data
      responses:
        '200':
          description: JSON export
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/admin/tenants:
    get:
      tags: [Admin]
      summary: List tenants (platform)
      responses:
        '200': { description: Tenants }
    post:
      tags: [Admin]
      summary: Create a tenant (platform)
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: Created }
  /api/admin/identity-providers:
    get:
      tags: [Admin]
      summary: List upstream identity providers
      responses:
        '200': { description: Providers }
  /api/admin/scim:
    get:
      tags: [Admin]
      summary: SCIM settings
      responses:
        '200': { description: SCIM status and endpoint }
  /t/{tenant}/.well-known/openid-configuration:
    get:
      tags: [OIDC]
      summary: OIDC discovery
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Discovery document }
  /t/{tenant}/oidc/jwks:
    get:
      tags: [OIDC]
      summary: Tenant JWKS
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: JSON Web Key Set }
  /t/{tenant}/oidc/token:
    post:
      tags: [OIDC]
      summary: Token endpoint
      security: []
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type: { type: string }
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
      responses:
        '200': { description: Token response }
  /t/{tenant}/oidc/userinfo:
    get:
      tags: [OIDC]
      summary: UserInfo
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      security:
        - bearerAuth: []
      responses:
        '200': { description: Claims }
  /t/{tenant}/scim/v2/Users:
    get:
      tags: [SCIM]
      summary: SCIM list users
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: SCIM list response }
    post:
      tags: [SCIM]
      summary: SCIM create user
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Created }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: uc_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ucm_ admin API token, JWT, or ucs_ SCIM token
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    LoginResponse:
      type: object
      properties:
        mfaRequired: { type: boolean }
        mfaSetupRequired: { type: boolean }
        user: { $ref: '#/components/schemas/User' }
        tenant: { $ref: '#/components/schemas/PublicTenant' }
        next: { type: string }
        requestId: { type: string }
    MeResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        tenant: { $ref: '#/components/schemas/PublicTenant' }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        isPlatformAdmin: { type: boolean }
    PublicTenant:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        status: { type: string }
        branding: { $ref: '#/components/schemas/Branding' }
        allowRegistration: { type: boolean }
        requireMfa: { type: boolean }
    Tenant:
      allOf:
        - $ref: '#/components/schemas/PublicTenant'
        - type: object
          properties:
            domains:
              type: array
              items: { type: string }
            settings: { type: object, additionalProperties: true }
            deletedAt: { type: string, format: date-time, nullable: true }
            purgeAfter: { type: string, format: date-time, nullable: true }
    Branding:
      type: object
      properties:
        logoUrl: { type: string }
        primaryColor: { type: string }
        backgroundColor: { type: string }
        supportEmail: { type: string }
        loginTemplate: { type: string }
        loginTagline: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        username: { type: string }
        status: { type: string }
        platformAdmin: { type: boolean }
        roles:
          type: array
          items: { type: string }
        mfa:
          type: object
          properties:
            enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    Role:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
        system: { type: boolean }
    OidcClient:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: string }
        type: { type: string, enum: [confidential, public] }
        redirectUris:
          type: array
          items: { type: string }
        allowedScopes:
          type: array
          items: { type: string }
        enabled: { type: boolean }
    CreateUserRequest:
      type: object
      required: [email, name]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        password: { type: string }
    CreateUserResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        tempPassword: { type: string }
        inviteSent: { type: boolean }
    UserPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
